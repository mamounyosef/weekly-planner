[env:esp32-s3-devkitc-1]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200

; ESP32-S3-N16R8: 16MB flash, 8MB octal PSRAM
board_build.flash_mode = qio
board_build.arduino.memory_type = qio_opi   ; required for this board's OPI PSRAM
; Two app slots, which is what makes OTA possible -- huge_app.csv has only one
; and silently defeats it. This firmware is ~285KB, so the smaller slots are
; not remotely a constraint.
board_build.partitions = min_spiffs.csv
board_upload.flash_size = 16MB
build_flags =
	-DBOARD_HAS_PSRAM
	-DARDUINO_USB_MODE=1
	-DARDUINO_USB_CDC_ON_BOOT=1
	-DCORE_DEBUG_LEVEL=1                    ; higher levels flood the I2C scan

lib_deps =
	marcoschwartz/LiquidCrystal_I2C@^1.1.4

; Wireless flashing, so the board can stay at the desk. Use with:
;   pio run -e ota -t upload
; The board must already be running firmware that includes ArduinoOTA -- the
; very first flash of this feature has to go over USB.
[env:ota]
extends = env:esp32-s3-devkitc-1
upload_protocol = espota
upload_port = planner-desk.local
upload_flags =
	--auth=planner-ota
	--host_ip=192.168.1.118
