name: CI Test Suite

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    name: Run Automated Tests & Build Verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck TypeScript
        run: pnpm --filter @workspace/weekly-planner run typecheck

      - name: Run Core Test Suites (Recurrence, Focus Timer, Ultrasonic Simulation, Hardware Controller, Backup)
        run: pnpm --filter @workspace/weekly-planner test

      - name: Production Bundle Build
        run: pnpm --filter @workspace/weekly-planner run build
